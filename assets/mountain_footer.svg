<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#01060f"/>
      <stop offset="100%" stop-color="#071526"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#00e5cc" stop-opacity="0.45"/>
      <stop offset="70%"  stop-color="#00bfff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glacierRiver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00e5cc" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#007acc" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e8f8ff"/>
      <stop offset="100%" stop-color="#8dc8e0" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <style>
      text { font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .tw { animation: tw 3.5s ease-in-out infinite alternate; }
      .tw2 { animation: tw 4.8s ease-in-out infinite alternate; }
      @keyframes tw { from{opacity:0.3} to{opacity:1} }
    </style>
  </defs>

  <rect width="1200" height="160" fill="url(#sky)"/>

  <!-- Stars -->
  <circle cx="60"  cy="14" r="0.8" fill="white" opacity="0.8" class="tw"/>
  <circle cx="210" cy="8"  r="0.7" fill="white" opacity="0.6" class="tw2"/>
  <circle cx="400" cy="18" r="0.9" fill="white" opacity="0.7" class="tw"/>
  <circle cx="620" cy="6"  r="0.8" fill="white" opacity="0.9" class="tw2"/>
  <circle cx="840" cy="15" r="0.7" fill="white" opacity="0.6" class="tw"/>
  <circle cx="1030" cy="10" r="0.9" fill="white" opacity="0.8" class="tw2"/>

  <!-- Aurora glow -->
  <path d="M0,38 Q300,12 600,32 Q900,52 1200,28"
        stroke="url(#aurora)" stroke-width="22" fill="none" filter="url(#glow)" opacity="0.5"/>
  <path d="M0,38 Q300,12 600,32 Q900,52 1200,28"
        stroke="#00e5cc" stroke-width="2" fill="none" opacity="0.35"/>

  <!-- Distant mountains -->
  <polygon points="0,108 60,62 120,108 200,50 280,96 360,56 440,108 520,48 600,102 680,55 760,99 840,58 920,108 1000,51 1080,103 1160,62 1200,78 1200,108"
           fill="#0d1f35" opacity="0.85"/>
  <!-- Snow caps -->
  <polygon points="200,50  218,75  182,75"  fill="url(#snow)" opacity="0.7"/>
  <polygon points="360,56  378,80  342,80"  fill="url(#snow)" opacity="0.65"/>
  <polygon points="520,48  540,76  500,76"  fill="url(#snow)" opacity="0.7"/>
  <polygon points="680,55  700,82  660,82"  fill="url(#snow)" opacity="0.65"/>
  <polygon points="840,58  860,85  820,85"  fill="url(#snow)" opacity="0.7"/>
  <polygon points="1000,51 1020,78 980,78"  fill="url(#snow)" opacity="0.65"/>

  <!-- Pine trees foreground -->
  <g fill="#04111e">
    <polygon points="0,160 15,110 30,160"/>
    <polygon points="20,160 36,98 52,160"/>
    <polygon points="42,160 57,108 72,160"/>
    <polygon points="130,160 145,104 160,160"/>
    <polygon points="150,160 166,94 182,160"/>
    <polygon points="310,160 324,102 338,160"/>
    <polygon points="326,160 342,90  358,160"/>
    <polygon points="520,160 534,100 548,160"/>
    <polygon points="538,160 554,92 570,160"/>
    <polygon points="720,160 734,98 748,160"/>
    <polygon points="738,160 754,88 770,160"/>
    <polygon points="900,160 915,102 930,160"/>
    <polygon points="918,160 934,92 950,160"/>
    <polygon points="1060,160 1076,100 1092,160"/>
    <polygon points="1080,160 1096,88 1112,160"/>
    <polygon points="1150,160 1166,104 1182,160"/>
    <polygon points="1168,160 1184,94 1200,160"/>
  </g>

  <!-- Glacier river at base -->
  <path d="M0,138 Q150,128 300,135 Q450,142 600,132 Q750,124 900,133 Q1050,140 1200,131"
        stroke="url(#glacierRiver)" stroke-width="5" fill="none" filter="url(#softGlow)"/>
  <path d="M0,138 Q150,128 300,135 Q450,142 600,132 Q750,124 900,133 Q1050,140 1200,131"
        stroke="#00ffcc" stroke-width="1" fill="none" opacity="0.45"/>

  <!-- Bottom fade -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#020b14" stop-opacity="0"/>
      <stop offset="100%" stop-color="#020b14" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="0" y="130" width="1200" height="30" fill="url(#fade)"/>
</svg>
