<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Expedition log — XploitVerse">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#060f1c"/>
      <stop offset="100%" stop-color="#030b14"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a1a28"/>
      <stop offset="100%" stop-color="#071420"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#09182a"/>
      <stop offset="100%" stop-color="#071522"/>
    </linearGradient>
    <radialGradient id="stampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5cc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00e5cc" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .pulse { animation: pulse 2.5s ease-in-out infinite alternate; }
      @keyframes pulse { from{opacity:0.4} to{opacity:1} }
      .ascending { animation: ascend 2s ease-in-out infinite alternate; }
      @keyframes ascend { from{transform:translateY(2px)} to{transform:translateY(-2px)} }
      .altimeter-fill { animation: altFill 3s ease-out forwards; transform-origin: bottom; }
      @keyframes altFill { from{transform:scaleY(0)} to{transform:scaleY(1)} }
    </style>
  </defs>

  <rect width="1000" height="280" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="278" rx="2" fill="none" stroke="#0c3a4a" stroke-width="1"/>

  <!-- Book spine / center -->
  <rect x="494" y="14" width="12" height="256" rx="3" fill="#0a1e30" stroke="#1a3a5a" stroke-width="1"/>
  <!-- Page shadow edges -->
  <rect x="22" y="14" width="2" height="252" rx="1" fill="#0c2030" opacity="0.5"/>
  <rect x="976" y="14" width="2" height="252" rx="1" fill="#0c2030" opacity="0.5"/>

  <!-- LEFT PAGE -->
  <rect x="24" y="14" width="470" height="252" rx="4" fill="url(#pageL)" stroke="#142535" stroke-width="0.8"/>
  <!-- Ruled lines (journal paper) -->
  <g stroke="#142535" stroke-width="0.6" opacity="0.7">
    <line x1="36" y1="50" x2="482" y2="50"/>
    <line x1="36" y1="68" x2="482" y2="68"/>
    <line x1="36" y1="86" x2="482" y2="86"/>
    <line x1="36" y1="104" x2="482" y2="104"/>
    <line x1="36" y1="122" x2="482" y2="122"/>
    <line x1="36" y1="140" x2="482" y2="140"/>
    <line x1="36" y1="158" x2="482" y2="158"/>
    <line x1="36" y1="176" x2="482" y2="176"/>
    <line x1="36" y1="194" x2="482" y2="194"/>
    <line x1="36" y1="212" x2="482" y2="212"/>
    <line x1="36" y1="230" x2="482" y2="230"/>
    <line x1="36" y1="248" x2="482" y2="248"/>
  </g>
  <!-- Left margin red line (journal style) -->
  <line x1="72" y1="14" x2="72" y2="266" stroke="#e63946" stroke-width="0.8" opacity="0.3"/>

  <!-- Journal entry -->
  <text x="80" y="32" font-size="10" fill="#596275" letter-spacing="2">EXPEDITION LOG · ENTRY #01</text>
  <text x="80" y="46" font-size="14" font-weight="700" fill="#00e5cc">XploitVerse</text>
  <line x1="80" y1="51" x2="350" y2="51" stroke="#00e5cc" stroke-width="0.8" opacity="0.4"/>

  <text x="80" y="66"  font-size="9"  fill="#596275">Expedition   <tspan fill="#eaf2ff">XploitVerse Platform</tspan></text>
  <text x="80" y="83"  font-size="9"  fill="#596275">Elevation    <tspan fill="#f7c948">6,100m · ascending</tspan></text>
  <text x="80" y="100" font-size="9"  fill="#596275">Status       <tspan fill="#00e5cc" class="pulse">▶ IN PROGRESS</tspan></text>
  <text x="80" y="117" font-size="9"  fill="#596275">Weather      <tspan fill="#eaf2ff">stable · clear</tspan></text>
  <text x="80" y="134" font-size="9"  fill="#596275">Team         <tspan fill="#eaf2ff">Solo</tspan></text>

  <!-- Divider dash -->
  <line x1="80" y1="142" x2="480" y2="142" stroke="#142535" stroke-width="0.8"/>

  <text x="80" y="157" font-size="9"  fill="#596275">Stack</text>
  <text x="168" y="157" font-size="9" fill="#4cc9f0">Node.js · Express · MongoDB · JWT</text>
  <text x="80" y="173" font-size="9"  fill="#596275">Tracks</text>
  <text x="168" y="173" font-size="9" fill="#eaf2ff">Web · Network · Binary Exploitation</text>
  <text x="80" y="189" font-size="9"  fill="#596275">Terrain</text>
  <text x="168" y="189" font-size="9" fill="#eaf2ff">Role-based labs · rate limiting</text>
  <text x="168" y="204" font-size="9" fill="#eaf2ff">security headers · payments</text>

  <!-- Divider -->
  <line x1="80" y1="212" x2="480" y2="212" stroke="#142535" stroke-width="0.8"/>

  <!-- Objective paragraph -->
  <text x="80" y="226" font-size="9" fill="#596275">Objective</text>
  <text x="80" y="241" font-size="9" fill="#8ba5b5">Teach cybersecurity through hands-on</text>
  <text x="80" y="255" font-size="9" fill="#8ba5b5">labs. Terminal-first. Curiosity to capable.</text>

  <!-- Date stamp -->
  <text x="385" y="266" font-size="7" fill="#1a3a4a">28 · JUL · 2026</text>

  <!-- RIGHT PAGE -->
  <rect x="506" y="14" width="470" height="252" rx="4" fill="url(#pageR)" stroke="#142535" stroke-width="0.8"/>

  <!-- Altitude graph (bar chart / elevation profile) -->
  <text x="520" y="32" font-size="9" fill="#2c7a8a" letter-spacing="2">ALTITUDE PROFILE</text>

  <!-- Graph axes -->
  <line x1="540" y1="45" x2="540" y2="200" stroke="#142535" stroke-width="1.2"/>
  <line x1="540" y1="200" x2="960" y2="200" stroke="#142535" stroke-width="1.2"/>

  <!-- Y-axis labels -->
  <text x="536" y="48"  text-anchor="end" font-size="7" fill="#596275">8848m</text>
  <text x="536" y="88"  text-anchor="end" font-size="7" fill="#596275">6100m</text>
  <text x="536" y="128" text-anchor="end" font-size="7" fill="#596275">4000m</text>
  <text x="536" y="168" text-anchor="end" font-size="7" fill="#596275">2000m</text>
  <text x="536" y="204" text-anchor="end" font-size="7" fill="#596275">0m</text>

  <!-- Grid lines -->
  <g stroke="#142535" stroke-width="0.6" opacity="0.5">
    <line x1="540" y1="45" x2="960" y2="45"/>
    <line x1="540" y1="85" x2="960" y2="85"/>
    <line x1="540" y1="125" x2="960" y2="125"/>
    <line x1="540" y1="165" x2="960" y2="165"/>
  </g>

  <!-- Elevation profile line -->
  <polyline points="540,200 580,192 620,185 660,175 700,160 740,148 780,132 820,115 860,100 900,87 940,78"
            stroke="#00e5cc" stroke-width="2.5" fill="none" filter="url(#glow)" opacity="0.9"/>
  <!-- Fill under curve -->
  <polygon points="540,200 580,192 620,185 660,175 700,160 740,148 780,132 820,115 860,100 900,87 940,78 940,200"
           fill="#00e5cc" opacity="0.07"/>

  <!-- Current position marker -->
  <circle cx="820" cy="115" r="6" fill="#00e5cc" class="pulse" filter="url(#glow)"/>
  <text x="828" y="110" font-size="8" fill="#00e5cc">6,100m</text>
  <!-- You are here arrow -->
  <text x="828" y="122" font-size="7" fill="#596275">▲ here</text>

  <!-- X-axis: time labels -->
  <text x="554" y="212" font-size="7" fill="#596275">Jan</text>
  <text x="660" y="212" font-size="7" fill="#596275">Apr</text>
  <text x="760" y="212" font-size="7" fill="#596275">Jul</text>
  <text x="870" y="212" font-size="7" fill="#596275">2026</text>

  <!-- Mini route sketch (simple mountain with path) -->
  <g transform="translate(520,225)">
    <text font-size="9" fill="#2c7a8a" letter-spacing="2">ROUTE SKETCH</text>
    <!-- Tiny mountain -->
    <polygon points="110,44 80,10 50,44" fill="#0d1e32" transform="translate(0,4)"/>
    <polygon points="110,44 80,12 52,44" fill="#eaf2ff" opacity="0.15" transform="translate(0,4)"/>
    <!-- Path -->
    <path d="M10,48 Q60,32 80,14" stroke="#00e5cc" stroke-width="1.5" fill="none" stroke-dasharray="3 4"/>
    <circle cx="80" cy="14" r="3" fill="#f7c948" class="pulse ascending"/>
    <!-- Summit flag -->
    <line x1="80" y1="4" x2="80" y2="14" stroke="#596275" stroke-width="1"/>
    <polygon points="80,4 90,8 80,12" fill="#ff9f43" opacity="0.8"/>
    <!-- Base -->
    <circle cx="10" cy="48" r="3" fill="#ff9f43"/>
    <!-- Labels -->
    <text x="2" y="56" font-size="6" fill="#596275">Base</text>
    <text x="74" y="3"  font-size="6" fill="#f7c948">Summit</text>
  </g>

  <!-- Stamp/seal overlay -->
  <g transform="translate(905,40)" opacity="0.25">
    <circle r="30" fill="none" stroke="#00e5cc" stroke-width="1.5"/>
    <circle r="25" fill="none" stroke="#00e5cc" stroke-width="0.8"/>
    <text x="0" y="-8"  text-anchor="middle" font-size="7" fill="#00e5cc" letter-spacing="1">ASCENDING</text>
    <text x="0" y="4"   text-anchor="middle" font-size="10" fill="#00e5cc">↑</text>
    <text x="0" y="16"  text-anchor="middle" font-size="7" fill="#00e5cc" letter-spacing="1">6100m</text>
  </g>

  <!-- Journal page number -->
  <text x="965" y="265" text-anchor="end" font-size="8" fill="#1a3a4a">p.01</text>
  <text x="40"  y="265" font-size="8" fill="#1a3a4a">p.01</text>
</svg>
