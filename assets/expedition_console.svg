<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc">
  <title id="title">Field Terminal — Operator Profile</title>
  <desc id="desc">Animated terminal dashboard showing operator identity, focus, and mission status.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#020b14"/>
      <stop offset="1" stop-color="#04141f"/>
    </linearGradient>
    <linearGradient id="scanLine" x1="0" x2="1">
      <stop stop-color="#00e5cc" stop-opacity="0"/>
      <stop offset=".2" stop-color="#00e5cc"/>
      <stop offset=".8" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace; }
      .scan   { animation: scan 4.2s linear infinite; }
      @keyframes scan {
        0%   { transform: translateX(-260px); opacity:0; }
        8%   { opacity:1; }
        92%  { opacity:1; }
        100% { transform: translateX(1260px); opacity:0; }
      }
      .pulse  { animation: pulse 2.6s ease-in-out infinite alternate; }
      @keyframes pulse { from{opacity:.3} to{opacity:1} }
      .dash   { stroke-dasharray:6 8; animation: dash 1.4s linear infinite; }
      @keyframes dash { to{stroke-dashoffset:-28} }
      .type   { animation: type 3.5s steps(24,end) 0.5s both; }
      @keyframes type {
        from { clip-path: inset(0 100% 0 0); }
        to   { clip-path: inset(0 0% 0 0); }
      }
      .cursor { animation: blink 1.1s step-end infinite; }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    </style>
  </defs>

  <!-- Body -->
  <rect width="1000" height="220" rx="14" fill="url(#bg)"/>
  <!-- Border -->
  <rect x="1" y="1" width="998" height="218" rx="13" fill="none" stroke="#0c4a5a" stroke-width="1.2"/>

  <!-- Grid lines -->
  <g opacity=".08" stroke="#67e8f9" stroke-width=".8">
    <path d="M0 44h1000M0 88h1000M0 132h1000M0 176h1000"/>
    <path d="M125 0v220M250 0v220M375 0v220M500 0v220M625 0v220M750 0v220M875 0v220"/>
  </g>

  <!-- Sweep scanner -->
  <g class="scan" opacity=".4">
    <rect x="0" y="0" width="200" height="220" fill="url(#scanLine)" opacity=".6"/>
  </g>

  <!-- Title bar -->
  <rect x="0" y="0" width="1000" height="38" rx="13" fill="#030e1a"/>
  <rect x="0" y="30" width="1000" height="8" fill="#030e1a"/>
  <!-- Traffic-light dots -->
  <circle cx="26" cy="19" r="5" fill="#e63946" opacity="0.8"/>
  <circle cx="46" cy="19" r="5" fill="#f4a261" opacity="0.8"/>
  <circle cx="66" cy="19" r="5" fill="#2dc653" opacity="0.8"/>
  <!-- Title text -->
  <text x="500" y="24" text-anchor="middle" font-size="11" fill="#5eead4" letter-spacing="4">
    FIELD TERMINAL  //  OPERATOR PROFILE
  </text>
  <!-- Status dot -->
  <circle class="pulse" cx="950" cy="19" r="5.5" fill="#00e5cc" filter="url(#glow)"/>
  <text x="967" y="24" font-size="10" fill="#6ee7b7">LIVE</text>

  <!-- ── LEFT COLUMN: Identity block ── -->
  <g transform="translate(28,56)">
    <!-- Label -->
    <text font-size="9" fill="#2c7a8a" letter-spacing="3">OPERATOR DOSSIER</text>
    <!-- Handle -->
    <text y="28" font-size="20" font-weight="700" fill="#e8fbff">XploitMonk0x01</text>
    <path class="dash" d="M0 36h240" stroke="#00e5cc" stroke-width="1.5"/>

    <text y="58"  font-size="10" fill="#4a9a9a">operator  <tspan fill="#c9d9e8">Chandan Singh</tspan></text>
    <text y="76"  font-size="10" fill="#4a9a9a">location  <tspan fill="#c9d9e8">India</tspan></text>
    <text y="94"  font-size="10" fill="#4a9a9a">mode      <tspan fill="#00e5cc">curious · persistent</tspan></text>
    <text y="112" font-size="10" fill="#4a9a9a">signal    <tspan fill="#6ee7b7">stable</tspan></text>
    <text y="130" font-size="10" fill="#4a9a9a">altitude  <tspan fill="#fbbf24">always climbing ↑</tspan></text>
  </g>

  <!-- Vertical separator -->
  <line x1="340" y1="50" x2="340" y2="205" stroke="#0c4a5a" stroke-width="1"/>

  <!-- ── MID COLUMN: Focus / mission ── -->
  <g transform="translate(364,56)">
    <text font-size="9" fill="#2c7a8a" letter-spacing="3">ACTIVE MISSION</text>

    <!-- Mission card 1 -->
    <g transform="translate(0,18)">
      <rect width="268" height="40" rx="7" fill="#031520" stroke="#00e5cc" stroke-width="0.8"/>
      <text x="12" y="15" font-size="9" fill="#5eead4" letter-spacing="1">01 / ANALYSE</text>
      <text x="12" y="31" font-size="14" font-weight="700" fill="#e2f9ff">Malware RE</text>
      <path class="dash" d="M12 37h220" stroke="#00e5cc" stroke-width="1.5"/>
    </g>
    <!-- Mission card 2 -->
    <g transform="translate(0,68)">
      <rect width="268" height="40" rx="7" fill="#031520" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="12" y="15" font-size="9" fill="#5eead4" letter-spacing="1">02 / TRACE</text>
      <text x="12" y="31" font-size="14" font-weight="700" fill="#e2f9ff">DFIR &amp; Artefacts</text>
      <path class="dash" d="M12 37h220" stroke="#38bdf8" stroke-width="1.5"/>
    </g>
    <!-- Mission card 3 -->
    <g transform="translate(0,118)">
      <rect width="268" height="40" rx="7" fill="#031520" stroke="#a78bfa" stroke-width="0.8"/>
      <text x="12" y="15" font-size="9" fill="#5eead4" letter-spacing="1">03 / BUILD</text>
      <text x="12" y="31" font-size="14" font-weight="700" fill="#e2f9ff">XploitVerse</text>
      <path class="dash" d="M12 37h220" stroke="#a78bfa" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Vertical separator -->
  <line x1="670" y1="50" x2="670" y2="205" stroke="#0c4a5a" stroke-width="1"/>

  <!-- ── RIGHT COLUMN: Story excerpt ── -->
  <g transform="translate(694,56)">
    <text font-size="9" fill="#2c7a8a" letter-spacing="3">NARRATIVE LOG</text>
    <foreignObject x="0" y="14" width="278" height="152">
      <!-- fallback paragraph for non-HTML SVG renderers -->
    </foreignObject>
    <!-- Wrapped text lines (manual) -->
    <text y="30"  font-size="10" fill="#8ba5b5" xml:space="preserve">"I like the part of security</text>
    <text y="46"  font-size="10" fill="#8ba5b5" xml:space="preserve"> work where a suspicious</text>
    <text y="62"  font-size="10" fill="#8ba5b5" xml:space="preserve"> binary becomes an</text>
    <text y="78"  font-size="10" fill="#8ba5b5" xml:space="preserve"> answerable question:</text>
    <text y="98"  font-size="10" fill="#6ee7b7">  what did it do,</text>
    <text y="114" font-size="10" fill="#6ee7b7">  how did it persist,</text>
    <text y="130" font-size="10" fill="#6ee7b7">  what trace did it leave?"</text>

    <!-- Prompt line -->
    <text y="158" font-size="10" fill="#00e5cc">~/summit $ _</text>
    <rect x="91" y="147" width="7" height="12" fill="#00e5cc" opacity="0.8" class="cursor"/>
  </g>

  <!-- Footer -->
  <text x="28" y="210" font-size="9" fill="#2c4a5a" letter-spacing="1">
    signal: stable  ·  mode: curious  ·  altitude: always learning  ·  target: the summit
  </text>
</svg>
