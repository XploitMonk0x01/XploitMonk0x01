<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%"  stop-color="#020b14"/>
      <stop offset="100%" stop-color="#030f1c"/>
    </linearGradient>
    <linearGradient id="trackLine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%"   stop-color="#020b14" stop-opacity="0"/>
      <stop offset="8%"   stop-color="#00e5cc"/>
      <stop offset="92%"  stop-color="#00e5cc"/>
      <stop offset="100%" stop-color="#020b14" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .pulse { animation: pulse 2.8s ease-in-out infinite alternate; }
      @keyframes pulse { from{opacity:0.5; filter:drop-shadow(0 0 3px #00e5cc);} to{opacity:1; filter:drop-shadow(0 0 10px #00e5cc);} }
      .pulse2 { animation: pulse 3.4s ease-in-out infinite alternate; }
      .pulse3 { animation: pulse 2.2s ease-in-out infinite alternate; }
      .traveller { animation: hike 14s linear infinite; }
      @keyframes hike {
        0%   { transform: translateX(60px); }
        100% { transform: translateX(1080px); }
      }
    </style>
  </defs>

  <rect width="1200" height="90" fill="url(#bg)"/>

  <!-- Track line (dashed) -->
  <line x1="80" y1="54" x2="1120" y2="54" stroke="#0c3a4a" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- Glow overlay on track -->
  <line x1="80" y1="54" x2="1120" y2="54" stroke="url(#trackLine)" stroke-width="1.5" opacity="0.5"/>

  <!-- Chapter nodes -->
  <!-- 1: Origin -->
  <g transform="translate(80,54)">
    <circle r="9" fill="#020b14" stroke="#00e5cc" stroke-width="2" class="pulse"/>
    <circle r="4" fill="#00e5cc" class="pulse"/>
    <text x="0" y="-18" text-anchor="middle" font-size="8" fill="#5eead4" letter-spacing="1">I</text>
    <text x="0" y="24" text-anchor="middle" font-size="8" fill="#8ba5b5">ORIGIN</text>
  </g>
  <!-- 2: Mission -->
  <g transform="translate(280,54)">
    <circle r="8" fill="#020b14" stroke="#38bdf8" stroke-width="1.8" class="pulse2"/>
    <circle r="3.5" fill="#38bdf8" class="pulse2"/>
    <text x="0" y="-17" text-anchor="middle" font-size="8" fill="#38bdf8" letter-spacing="1">II</text>
    <text x="0" y="24" text-anchor="middle" font-size="8" fill="#8ba5b5">MISSION</text>
  </g>
  <!-- 3: Arsenal -->
  <g transform="translate(480,54)">
    <circle r="8" fill="#020b14" stroke="#a78bfa" stroke-width="1.8" class="pulse3"/>
    <circle r="3.5" fill="#a78bfa" class="pulse3"/>
    <text x="0" y="-17" text-anchor="middle" font-size="8" fill="#a78bfa" letter-spacing="1">III</text>
    <text x="0" y="24" text-anchor="middle" font-size="8" fill="#8ba5b5">ARSENAL</text>
  </g>
  <!-- 4: Expeditions -->
  <g transform="translate(680,54)">
    <circle r="8" fill="#020b14" stroke="#e63946" stroke-width="1.8" class="pulse"/>
    <circle r="3.5" fill="#e63946" class="pulse"/>
    <text x="0" y="-17" text-anchor="middle" font-size="8" fill="#e63946" letter-spacing="1">IV</text>
    <text x="0" y="24" text-anchor="middle" font-size="8" fill="#8ba5b5">EXPEDITIONS</text>
  </g>
  <!-- 5: Credentials -->
  <g transform="translate(880,54)">
    <circle r="8" fill="#020b14" stroke="#fbbf24" stroke-width="1.8" class="pulse2"/>
    <circle r="3.5" fill="#fbbf24" class="pulse2"/>
    <text x="0" y="-17" text-anchor="middle" font-size="8" fill="#fbbf24" letter-spacing="1">V</text>
    <text x="0" y="24" text-anchor="middle" font-size="8" fill="#8ba5b5">CREDENTIALS</text>
  </g>
  <!-- 6: Summit (dashed, unfilled = future) -->
  <g transform="translate(1120,54)">
    <circle r="9" fill="#020b14" stroke="#00e5cc" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
    <text x="0" y="-17" text-anchor="middle" font-size="8" fill="#00e5cc" letter-spacing="1" opacity="0.6">VI</text>
    <text x="0" y="24"  text-anchor="middle" font-size="8" fill="#5d7a8a">SUMMIT ↑</text>
  </g>

  <!-- Moving traveller icon (simple hiking figure) -->
  <g class="traveller">
    <circle cx="0" cy="44" r="4" fill="#e8fbff" opacity="0.9"/>
    <line x1="0" y1="48" x2="0" y2="60" stroke="#e8fbff" stroke-width="1.5" opacity="0.9"/>
    <line x1="0" y1="53" x2="-6" y2="58" stroke="#e8fbff" stroke-width="1.2" opacity="0.9"/>
    <line x1="0" y1="53" x2="6"  y2="57" stroke="#e8fbff" stroke-width="1.2" opacity="0.9"/>
    <line x1="0" y1="60" x2="-5" y2="68" stroke="#e8fbff" stroke-width="1.2" opacity="0.9"/>
    <line x1="0" y1="60" x2="5"  y2="68" stroke="#e8fbff" stroke-width="1.2" opacity="0.9"/>
    <!-- Trekking pole -->
    <line x1="-6" y1="49" x2="-10" y2="68" stroke="#00e5cc" stroke-width="1" opacity="0.7"/>
  </g>
</svg>
